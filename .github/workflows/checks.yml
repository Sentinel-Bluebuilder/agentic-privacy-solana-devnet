# ─── checks: run on every push and pull request ───
# Text and unit checks only: no wallet, no secret, no transaction. The only network use is downloading public
# code (npm packages, the public sentinel-solana repo and IDL at the pinned commit) for the example step.
#
# Per release (S11): these checks run on every push. The LIVE checks, `sh direct/faults.sh` and the paid
# `sh direct/selftest.sh`, cannot run here (they need a VM, root and a devnet wallet). They are re-run on an
# Azure Ubuntu VM whenever the pinned upstream commit, Go version or a `direct-vN` release changes, and after any
# change to direct/*.sh; each run's log is kept, dated, and cited in docs/DIRECT.md ("Per release").
# tools/check-faults-fresh.mjs enforces it where the dated logs are (the hub): it fails when direct/*.sh or
# direct/SHA256SUMS changed in a commit after the newest passing faults log.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-faults-fresh reads commit order

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installers parse (bash -n, sh -n)
        run: |
          bash -n install.sh
          sh -n install.sh
          for f in direct/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: MCP server unit tests
        run: node --test mcp/server.test.js

      - name: Example agent loop against its stub CLI (docs/examples, no network, no wallet)
        run: node --test docs/examples/agent-loop.test.mjs

      - name: Public-file check (only where the private checker is present)
        if: hashFiles('tools/check-public.sh') != ''
        run: bash tools/check-public.sh

      - name: Secret scan (with a planted positive control)
        run: sh tools/secret-scan.sh

      - name: Path B last lines match direct/schema (every good fixture passes, every bad one fails)
        run: |
          for f in direct/schema/*.json; do python3 -I -m json.tool "$f" >/dev/null; done
          n=0
          while IFS= read -r line; do
            python3 -I direct/schema/validate.py "$line" >/dev/null || { echo "should pass: $line"; exit 1; }
            n=$((n + 1))
          done < fixtures/direct-lines.jsonl
          b=0
          while IFS= read -r line; do
            if python3 -I direct/schema/validate.py "$line" >/dev/null; then echo "should fail: $line"; exit 1; fi
            b=$((b + 1))
          done < fixtures/direct-lines-bad.jsonl
          [ "$n" -gt 0 ] && [ "$b" -gt 0 ] || { echo "no fixture lines read"; exit 1; }
          echo "schema: $n good lines pass, $b bad lines fail"
          # S3: real output, not only hand-made lines. fixtures/direct-lines-captured.jsonl = every last line the
          # scripts printed in the dated live runs (B1, D9 2026-11-20), our addresses and IPs replaced by
          # tools/capture-direct-lines.mjs. Every one must pass its schema.
          c=0
          while IFS= read -r line; do
            python3 -I direct/schema/validate.py "$line" >/dev/null || { echo "captured line fails its schema: $line"; python3 -I direct/schema/validate.py "$line"; exit 1; }
            c=$((c + 1))
          done < fixtures/direct-lines-captured.jsonl
          [ "$c" -ge 10 ] || { echo "only $c captured lines read"; exit 1; }
          echo "schema: $c captured live lines pass"

      - name: The newest live faults run is newer than every script change (where the dated logs are)
        if: hashFiles('tools/check-faults-fresh.mjs') != ''
        run: node tools/check-faults-fresh.mjs

      # S16: the build-your-own-client examples, with no wallet and no transaction. Go: vet and build against the
      # public sentinel-solana at the pinned commit (go.mod points at ../ss). TS: the §9 error table in
      # BUILD-YOUR-OWN-CLIENT.md must equal what errors.ts + the public IDL print (gen-error-table.ts --check).
      # Downloads the public repo, the IDL and the pinned npm packages; reads nothing of ours.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Path B example programs (Go vet + build, TS error table; no wallet)
        env:
          SS_COMMIT: 26de52407c5b722cfecad1772dcbeefd984ef6d0
        run: |
          cd docs/build-your-own-client
          git init -q ss
          git -C ss remote add origin https://github.com/sentinel-official/sentinel-solana
          git -C ss fetch -q --depth 1 origin "$SS_COMMIT"
          git -C ss checkout -q FETCH_HEAD
          (cd go && GOTOOLCHAIN=local go mod tidy && go vet ./... && go build -o /dev/null .)
          cd ts
          curl -fsSL -o dvpn.json "https://raw.githubusercontent.com/sentinel-official/sentinel-solana/$SS_COMMIT/sentinel-programs/idl/dvpn.json"
          npm install --no-audit --no-fund --silent
          npx tsx gen-error-table.ts --check ../../BUILD-YOUR-OWN-CLIENT.md
          cd .. && rm -rf ss go/go.sum ts/node_modules ts/package-lock.json ts/dvpn.json && git checkout -- go/go.mod

      - name: Agent answers match the JSON Schema (Ajv 2020)
        run: |
          tmp="$(mktemp -d)"
          (cd "$tmp" && npm init -y >/dev/null && npm i --no-audit --no-fund --silent ajv@8.17.1)
          cd "$tmp" && node "$GITHUB_WORKSPACE/tools/check-agent-answers.mjs" \
            "$GITHUB_WORKSPACE/docs/agent-answers.schema.json" \
            "$GITHUB_WORKSPACE/fixtures/agent-answers.jsonl"

      - name: Glossary and failure-code page (self-controls; codes are skipped without the app source)
        if: hashFiles('tools/check-glossary.mjs') != ''
        run: node tools/check-glossary.mjs

      # Every reachable failure code has a row and an anchor in docs/CODES.md. Off until the repository
      # variable DVPN_APP_SRC_REF names a ref of the app repo whose src/cli holds agent-cmd.ts
      # (the v0.3.0-rc6 tag there points at an older tree without it).
      - name: Check out the app source at DVPN_APP_SRC_REF
        if: hashFiles('tools/check-glossary.mjs') != '' && vars.DVPN_APP_SRC_REF != ''
        uses: actions/checkout@v4
        with:
          repository: Sentinel-Bluebuilder/sentinel-solana-dvpn-linux
          ref: ${{ vars.DVPN_APP_SRC_REF }}
          path: app-src
          sparse-checkout: src

      - name: Every reachable failure code has a row and an anchor (against the app source)
        if: hashFiles('tools/check-glossary.mjs') != '' && vars.DVPN_APP_SRC_REF != ''
        run: node tools/check-glossary.mjs --src app-src --require-src

      - name: llms-full.txt is up to date
        run: |
          git ls-files --error-unmatch llms-full.txt >/dev/null
          sh tools/make-llms-full.sh
          git diff --exit-code -- llms-full.txt
